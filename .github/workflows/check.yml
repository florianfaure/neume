# Le vérificateur (et le site) sur chaque PR et sur main : rouge, on ne fusionne pas.
name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # Le site, sans `copies:check` (il lit ~/portfolio) ni le build (Workers Builds le fait) : lint, types et
      # les tests du Worker de la demande d'icône, dans le runtime Workers.
      - run: npm run lint -w site && npm run typecheck -w site && npm test -w site
