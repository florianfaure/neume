# Publication sur npm, déclenchée par une release GitHub (tag vX.Y.Z) — et par rien d'autre.
# Aucun jeton : npm reconnaît ce workflow comme « trusted publisher » (OIDC), réglage fait une fois
# par paquet sur npmjs.com. Le nom de fichier `release.yml` fait partie de ce réglage : ne pas le renommer.
# Publication PAR ÉTAPES : le trusted publisher n'autorise que `npm stage publish` (le défaut de npm, et le
# choix de Florian). Le workflow dépose les deux versions en attente ; Florian les approuve sur npmjs.com,
# avec sa 2FA, svg d'abord. Un `npm publish` direct est refusé (403 « OIDC permission denied »).
name: release
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # `npm stage publish` demande npm ≥ 11.15.0. Version exacte : ce job peut publier, il n'installe rien
      # qui bouge sans commit (de même, les actions sont épinglées à leur commit, l'étiquette en commentaire).
      - run: npm install -g npm@11.21.2
      - run: npm ci
      - name: Le tag et les paquets disent la même version
        run: node scripts/version.mjs --assert "${GITHUB_REF_NAME#v}"
      - run: npm run check
      # Le cœur d'abord : @neume-icons/react en dépend (à l'approbation aussi, svg avant react).
      - run: npm stage publish -w @neume-icons/svg --access public
      - run: npm stage publish -w @neume-icons/react --access public
